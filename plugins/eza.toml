# A TOML plugin for proto:
# https://moonrepo.dev/docs/proto/plugins#toml-plugin
#
# eza - 现代 ls 替代（用户 zsh 已激活，带 OSC8 超链接）。

name = "eza"
type = "cli"

[platform.linux]
download-file = "eza_{arch}-unknown-linux-musl.tar.gz"

[platform.macos]
download-file = "eza_{arch}-apple-darwin.tar.gz"

[platform.windows]
download-file = "eza_{arch}-pc-windows-msvc.zip"

[install]
download-url = "https://github.com/eza-community/eza/releases/download/v{version}/{download_file}"
unpack = true

[install.arch]
aarch64 = "aarch64"
x86_64 = "x86_64"

[resolve]
git-url = "https://github.com/eza-community/eza"
