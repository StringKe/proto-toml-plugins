# A TOML plugin for proto:
# https://moonrepo.dev/docs/proto/plugins#toml-plugin
#
# starship - 跨 shell 提示符（用户 zsh 已激活）。

name = "starship"
type = "cli"

[platform.linux]
download-file = "starship-{arch}-unknown-linux-musl.tar.gz"

[platform.macos]
download-file = "starship-{arch}-apple-darwin.tar.gz"

[platform.windows]
download-file = "starship-{arch}-pc-windows-msvc.zip"

[install]
download-url = "https://github.com/starship/starship/releases/download/v{version}/{download_file}"
unpack = true

[install.arch]
aarch64 = "aarch64"
x86_64 = "x86_64"

[resolve]
git-url = "https://github.com/starship/starship"
