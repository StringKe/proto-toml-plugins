# A TOML plugin for proto:
# https://moonrepo.dev/docs/proto/plugins#toml-plugin
#
# eksctl - Amazon EKS 集群管理 CLI（用户已装）。

name = "eksctl"
type = "cli"

[platform.linux]
download-file = "eksctl_{os}_{arch}.tar.gz"

[platform.macos]
download-file = "eksctl_{os}_{arch}.tar.gz"

[platform.windows]
download-file = "eksctl_{os}_{arch}.tar.gz"

[install]
download-url = "https://github.com/aws/eksctl/releases/download/v{version}/{download_file}"
unpack = true

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[resolve]
git-url = "https://github.com/aws/eksctl"
