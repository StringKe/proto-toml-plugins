# A TOML plugin for proto:
# https://moonrepo.dev/docs/proto/plugins#toml-plugin
#
# cloudflared - Cloudflare Tunnel / Argo 客户端（用户已装）。

name = "cloudflared"
type = "cli"

[platform.linux]
download-file = "cloudflared-linux-{arch}"
exe-path = "cloudflared-linux-{arch}"

[platform.macos]
download-file = "cloudflared-darwin-{arch}.tgz"
exe-path = "cloudflared"

[platform.windows]
download-file = "cloudflared-windows-{arch}.exe"
exe-path = "cloudflared-windows-{arch}.exe"

[install]
download-url = "https://github.com/cloudflare/cloudflared/releases/download/{version}/{download_file}"

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[resolve]
git-url = "https://github.com/cloudflare/cloudflared"
