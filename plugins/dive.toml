# A TOML plugin for proto:
# https://moonrepo.dev/docs/proto/plugins#toml-plugin
#
# dive - Docker 镜像层分析工具。

name = "dive"
type = "cli"

[platform.linux]
download-file = "dive_{version}_linux_{arch}.tar.gz"

[platform.macos]
download-file = "dive_{version}_darwin_{arch}.tar.gz"

[platform.windows]
download-file = "dive_{version}_windows_{arch}.zip"

[install]
download-url = "https://github.com/wagoodman/dive/releases/download/v{version}/{download_file}"
unpack = true

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[resolve]
git-url = "https://github.com/wagoodman/dive"
