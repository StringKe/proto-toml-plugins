# A TOML plugin for proto:
# https://moonrepo.dev/docs/proto/plugins#toml-plugin
#
# oras - OCI registry artifact 推拉工具。

name = "oras"
type = "cli"

[platform.linux]
download-file = "oras_{version}_linux_{arch}.tar.gz"

[platform.macos]
download-file = "oras_{version}_darwin_{arch}.tar.gz"

[platform.windows]
download-file = "oras_{version}_windows_{arch}.zip"

[install]
download-url = "https://github.com/oras-project/oras/releases/download/v{version}/{download_file}"
unpack = true

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[resolve]
git-url = "https://github.com/oras-project/oras"
