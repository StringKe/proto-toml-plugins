# A TOML plugin for proto:
# https://moonrepo.dev/docs/proto/plugins#toml-plugin
#
# tektoncd-cli (tkn) - Tekton Pipelines CLI（用户已装）。

name = "tkn"
type = "cli"

[platform.linux]
download-file = "tkn_{version}_Linux_{arch}.tar.gz"

[platform.macos]
download-file = "tkn_{version}_Darwin_{arch}.tar.gz"

[platform.windows]
download-file = "tkn_{version}_Windows_{arch}.zip"

[install]
download-url = "https://github.com/tektoncd/cli/releases/download/v{version}/{download_file}"
unpack = true

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[resolve]
git-url = "https://github.com/tektoncd/cli"
