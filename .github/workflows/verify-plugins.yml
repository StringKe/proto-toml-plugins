name: Verify Proto TOML Plugins

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/**'
      - 'scripts/verify.sh'
      - 'tests/known-good.json'
      - '.github/workflows/verify-plugins.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'scripts/verify.sh'
      - 'tests/known-good.json'
      - '.github/workflows/verify-plugins.yml'
  schedule:
    # Daily at 04:15 UTC — tests latest versions of all plugins (thorough)
    - cron: '15 4 * * *'
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Quick parallel testing across common platforms on every push/PR
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install jq (for known-good.json)
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update -y && sudo apt-get install -y jq
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install jq
          else
            # Windows: use Chocolatey (available on GitHub windows runners)
            choco install jq -y --no-progress
          fi

      - name: Run verification (Unix)
        if: matrix.os != 'windows-latest'
        env:
          USE_LATEST: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [ "$USE_LATEST" = "true" ]; then
            echo "Running latest-version verification on ${{ matrix.os }}"
            ./scripts/verify.sh --latest
          else
            echo "Running fast verification against known-good versions on ${{ matrix.os }}"
            ./scripts/verify.sh
          fi

      - name: Run verification (Windows)
        if: matrix.os == 'windows-latest'
        env:
          USE_LATEST: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          if ($env:USE_LATEST -eq "true") {
            Write-Host "Running latest-version verification on ${{ matrix.os }}"
            ./scripts/verify.ps1 --latest
          } else {
            Write-Host "Running fast verification against known-good versions on ${{ matrix.os }}"
            ./scripts/verify.ps1
          }

      - name: Upload verification log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log-${{ matrix.os }}-${{ github.run_id }}
          path: |
            /tmp/proto-verify-run-*/**/*
            ${{ runner.temp }}/proto-verify-run-*/**/*
            ${{ runner.temp }}/**/proto-verify-run*/**/*
          retention-days: 7
