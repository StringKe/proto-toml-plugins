name: Update plugin versions

on:
  schedule:
    # Every 3 days at 05:30 UTC.
    - cron: '30 5 */3 * *'
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Space-separated plugin names to update (empty = all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Run update script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          ./scripts/update-versions.sh ${{ github.event.inputs.plugins }} | tee /tmp/bump.log

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- tests/known-good.json README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/update-versions
          delete-branch: true
          commit-message: 'chore(versions): refresh plugin pins via update-versions.sh'
          title: 'chore(versions): refresh plugin pins'
          body: |
            Auto-generated by `.github/workflows/update-versions.yml`.

            ```text
            $(cat /tmp/bump.log)
            ```
          labels: |
            automation
            versions
