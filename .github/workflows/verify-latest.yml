name: Verify plugins (daily --latest)

# Catches upstream release-mechanism changes (renamed assets, new archive layouts,
# checksum format changes) by installing the actual latest published version of
# every plugin. Fast verify-plugins.yml only checks the pinned known-good versions.

on:
  schedule:
    - cron: '15 4 * * *'   # daily 04:15 UTC
  workflow_dispatch:

jobs:
  verify-latest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update -y && sudo apt-get install -y jq
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install jq
          else
            choco install jq -y --no-progress
          fi

      - name: Run verification --latest (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ./scripts/verify.sh --latest

      - name: Run verification --latest (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/verify.ps1 -Latest

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-latest-${{ matrix.os }}-${{ github.run_id }}
          path: |
            /tmp/proto-verify-run-*/**/*
            ${{ runner.temp }}/proto-verify-run-*/**/*
            ${{ runner.temp }}/**/proto-verify-run*/**/*
          retention-days: 14
